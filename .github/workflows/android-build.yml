name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [d2-android-cn-touch-glass]
    paths:
      - 'source/winlator/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: yes | sdkmanager --licenses && sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Build debug APK
        working-directory: source/winlator
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: D2Android-debug-apk
          path: source/winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
