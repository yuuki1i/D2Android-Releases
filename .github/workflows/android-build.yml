name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [d2-android-cn-touch-glass, 'fix/**']
    paths:
      - 'source/winlator/**'
      - 'source/mod/**'
      - 'source/tools/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: write

concurrency:
  group: d2android-touch-glass-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Use the runner's preinstalled SDK directly; setup-android has failed
      # while resolving the obsolete "tools" package on recent SDK mirrors.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;34.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu libasound2-dev libx11-dev python3-zstandard
      - name: Cache D2Android runtime build sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/d2android
          key: d2-runtime-v2-${{ hashFiles('source/tools/build-runtime.sh', 'source/tools/build-runtime.py', 'source/tools/binpatch.py', 'source/tools/fetch-winlator101.sh', 'source/tools/alsa-plugin/**', 'source/tools/patches/vortek-client-*.patch') }}
      - name: Build and bundle Wine / Box64 runtime
        working-directory: source
        env:
          # The debug build uses this application id (see app/build.gradle); the runtime
          # asset carries the package it was built for and the app refuses one that
          # names another package ("missing runtime").
          D2_PACKAGE: at.d2android.cn
        run: bash tools/build-runtime.sh
      - name: Fetch D2DX / PlugY assets and build the native mod
        working-directory: source
        run: |
          sudo apt-get install -y -q gcc-mingw-w64-i686 binutils-mingw-w64-i686
          bash tools/fetch-winlator101.sh
          bash tools/build-mod.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('source/winlator/**/*.gradle*', 'source/winlator/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build debug APK
        working-directory: source/winlator
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "Build attempt $attempt failed; retrying after cooldown."
            sleep $((attempt * 25))
          done
          exit 1
      - name: Verify APK output
        run: |
          APK="$(find source/winlator/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: D2Android-debug-apk
          path: source/winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/fix/gameloop-chain' || startsWith(github.ref, 'refs/heads/fix/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find source/winlator/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK"             --title "D2Android 1.13c pack test ${GITHUB_RUN_NUMBER}"             --notes "Automatic build from ${GITHUB_SHA:0:8}: pack native mode, 4:3 picture, pack data diagnosis."             --latest
          echo "release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
