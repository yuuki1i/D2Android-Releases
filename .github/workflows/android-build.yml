name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [d2-android-cn-touch-glass]
    paths:
      - 'source/winlator/**'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Use the runner's preinstalled SDK directly; setup-android has failed
      # while resolving the obsolete "tools" package on recent SDK mirrors.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;34.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('source/winlator/**/*.gradle*', 'source/winlator/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build debug APK
        working-directory: source/winlator
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "Build attempt $attempt failed; retrying after cooldown."
            sleep $((attempt * 25))
          done
          exit 1
      - name: Verify APK output
        run: |
          APK="$(find source/winlator/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK_PATH=$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: D2Android-debug-apk
          path: source/winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
